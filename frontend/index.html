<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NexChat</title>
  <link rel="icon" href="assets/icon-nexchat.png?v=7" />
  <link rel="stylesheet" href="css/variables.css?v=7" />
  <link rel="stylesheet" href="css/loader.css?v=7" />
  <link rel="stylesheet" href="css/auth.css?v=7" />
  <link rel="stylesheet" href="css/app.css?v=7" />
</head>
<body>

  <!-- Écran d'authentification -->
  <main id="nc-auth-screen" class="nc-auth-screen" hidden>
    <img src="assets/logo-nexchat.jpg?v=7" alt="NexChat" class="nc-auth-logo" />

    <!-- Vue : connexion -->
    <section id="nc-view-login" class="nc-auth-view">
      <h1>Connexion</h1>
      <input id="login-email" type="email" placeholder="Adresse email" autocomplete="email" />
      <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
      <button id="btn-login" class="nc-btn-primary">Se connecter</button>
      <p class="nc-auth-error" id="login-error"></p>
      <p class="nc-auth-switch">Pas encore de compte ? <a id="go-signup" href="#">Créer un compte</a></p>
    </section>

    <!-- Vue : inscription -->
    <section id="nc-view-signup" class="nc-auth-view" hidden>
      <h1>Créer un compte</h1>
      <input id="signup-username" type="text" placeholder="Nom d'utilisateur" autocomplete="username" />
      <input id="signup-email" type="email" placeholder="Adresse email" autocomplete="email" />
      <input id="signup-password" type="password" placeholder="Mot de passe" autocomplete="new-password" />
      <button id="btn-signup" class="nc-btn-primary">Continuer</button>
      <p class="nc-auth-error" id="signup-error"></p>
      <p class="nc-auth-switch">Déjà un compte ? <a id="go-login" href="#">Se connecter</a></p>
    </section>

    <!-- Vue : saisie du code reçu par email -->
    <section id="nc-view-code" class="nc-auth-view" hidden>
      <h1>Vérifie ton email</h1>
      <p class="nc-auth-subtitle">Un code à 6 chiffres a été envoyé à ton adresse email.</p>
      <input id="signup-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" class="nc-code-input" />
      <button id="btn-confirm-code" class="nc-btn-primary">Valider</button>
      <p class="nc-auth-error" id="code-error"></p>
    </section>
  </main>

  <!-- Coquille applicative principale (remplie une fois connecté) -->
  <main id="nc-app-shell" class="nc-app-shell" hidden>
    <nav class="nc-tabbar">
      <button data-tab="chats" class="nc-tab-btn active">Discussions</button>
      <button data-tab="statuses" class="nc-tab-btn">Statuts</button>
      <button data-tab="groups" class="nc-tab-btn">Groupes</button>
      <button data-tab="search" class="nc-tab-btn">Rechercher</button>
      <button data-tab="profile" class="nc-tab-btn">Profil</button>
    </nav>
    <section id="nc-tab-content" class="nc-tab-content">
      <!-- Rempli dynamiquement par app.js selon l'étape du projet -->
    </section>
  </main>

  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
